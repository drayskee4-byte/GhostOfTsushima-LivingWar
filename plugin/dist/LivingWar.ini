; Ghost of Tsushima: Living War - plugin settings
; Gameplay tuning (cheat-death odds, hate, XP...) lives in LivingWar\LivingWar.json,
; which is created with every default value the first time the plugin runs.

[General]
Enabled=1
; One persistent world per name. Use a different slot for a different playthrough.
SaveSlot=default
WorldSeed=1274
; Which campaign act you are in (1-3). Unlocks regions: 1=Izuhara, 2=+Toyotama & Iki, 3=+Kamiagata.
CampaignAct=1
; Seconds to wait after the game starts before initialising.
StartDelaySeconds=10
; Hooks only switch on for this exact game build (PE timestamp, hex). 0 = don't check.
ExpectedBuildTimestamp=0x6A3AAFBD
DebugLog=0

[World]
; Until the in-game clock is hooked, the world advances one day per this many minutes of
; real play time (only while the game window has focus).
RealMinutesPerWorldDay=30

[Chronicle]
; Manual mode: tell Living War about your fights with hotkeys while the automatic hooks are
; still being built. Results go to LivingWar\feed.txt and the hierarchy page (F9).
Enabled=1
StartRegion=izuhara
; Highest rank you can run into with F7 (1=Arban ... 5=Khan's Noyan)
MaxRank=3

[Recon]
; Read-only census of characters (spawn, damage, death) to learn how the game marks leaders.
; Only switches on when the game build matches ExpectedBuildTimestamp. Writes LivingWar\census.csv.
; Press the Mark key (F11) right after you kill a camp leader, so the log shows which one it was.
Enabled=1
Mark=0x7A

[Keys]
; Windows virtual-key codes. Defaults: F7 engage, F8 cycle region, F9 hierarchy, F10 save.
; Outcomes while engaged (number pad): 1 killed him (blade), 2 killed him (stealth),
; 3 killed him (fire), 4 killed him (arrows), 5 he fled, 6 I spared him, 7 he killed me,
; 8 I escaped, 0 killed 5 of his men.
Engage=0x76
CycleRegion=0x77
Hierarchy=0x78
Save=0x79
