name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLW_BUILD_PLUGIN=OFF
      - run: cmake --build build -j
      - run: ./build/lw_tests
      - run: ./build/lwsim demo --data demo-data
  plugin-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64 -DLW_BUILD_PLUGIN=ON
      - run: cmake --build build --config Release
      - run: build\Release\lw_tests.exe
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/plugins | Out-Null
          Copy-Item build/plugin/Release/LivingWar.asi dist/plugins/
          Copy-Item plugin/dist/LivingWar.ini, plugin/dist/GotSignatures.ini dist/plugins/
          Copy-Item build/Release/lwsim.exe dist/
          Copy-Item INSTALL.md, CREDITS.md dist/
      - name: Bundle Ultimate ASI Loader (MIT, ThirteenAG) as d3d12.dll
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R ThirteenAG/Ultimate-ASI-Loader -p "Ultimate-ASI-Loader_x64.zip" -D ual
          Expand-Archive ual/Ultimate-ASI-Loader_x64.zip -DestinationPath ual/x
          $dll = Get-ChildItem ual/x -Recurse -Filter *.dll | Select-Object -First 1
          Copy-Item $dll.FullName dist/d3d12.dll
          gh release view -R ThirteenAG/Ultimate-ASI-Loader --json tagName -q .tagName | Out-File dist/UltimateASILoader-version.txt
          Copy-Item ual/x/* -Include *.txt,*.md,LICENSE* dist/ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: LivingWar-windows
          path: dist
  publish:
    needs: plugin-windows
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LivingWar-windows
          path: publish
      - name: Push to the 'builds' branch
        run: |
          set -euo pipefail
          trap 'echo "::error::publish failed at line $LINENO: $BASH_COMMAND"' ERR
          cd publish
          echo "Built from ${GITHUB_SHA::7} on $(date -u +%F)" > BUILD.txt
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "LivingWar build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds 2>&1 | sed 's/^/::notice::/'
